<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI ProjectOS — AI-native project management" />
    <title>AI ProjectOS</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash of wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('apos.theme');
          var mode = raw ? JSON.parse(raw).state.mode : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
