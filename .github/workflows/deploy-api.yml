name: Deploy API

# Build the API/worker image → run idempotent migrations → deploy to Railway →
# health-gate the new release. The platform keeps the previous image, so a failed
# health gate is a safe no-op (rollback = redeploy the previous image).
#
# Required secrets:
#   RAILWAY_TOKEN, RAILWAY_API_SERVICE, RAILWAY_WORKER_SERVICE
#   MONGODB_URI, REDIS_URL, QDRANT_URL (migration step)
#   API_HEALTH_URL (public /health/ready of the API)
#   SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT (source maps / release)
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Idempotent index + Qdrant bootstrap using the freshly built image.
      - name: Run migrations
        run: |
          docker run --rm \
            -e NODE_ENV=production \
            -e MONGODB_URI='${{ secrets.MONGODB_URI }}' \
            -e REDIS_URL='${{ secrets.REDIS_URL }}' \
            -e QDRANT_URL='${{ secrets.QDRANT_URL }}' \
            -e JWT_ACCESS_SECRET='${{ secrets.JWT_ACCESS_SECRET }}' \
            -e JWT_REFRESH_SECRET='${{ secrets.JWT_REFRESH_SECRET }}' \
            ${{ env.IMAGE }}:${{ github.sha }} node dist/scripts/migrate.js

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API + worker (rolling)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway redeploy --service '${{ secrets.RAILWAY_API_SERVICE }}' --yes
          railway redeploy --service '${{ secrets.RAILWAY_WORKER_SERVICE }}' --yes

      # Health-gated cutover: fail the deploy if the new release isn't ready.
      - name: Wait for healthy /health/ready
        run: |
          url='${{ secrets.API_HEALTH_URL }}'
          for i in $(seq 1 30); do
            if curl -fsS "$url" | grep -q '"status":"ok"'; then
              echo "Healthy after ${i} attempt(s)."; exit 0
            fi
            echo "Not ready yet (attempt ${i})…"; sleep 10
          done
          echo "::error::API did not become healthy; platform retains the previous release."
          exit 1

      # Associate errors with this release + upload source maps.
      - name: Create Sentry release
        if: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          version: ${{ github.sha }}
