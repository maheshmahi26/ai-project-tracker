name: E2E

# High-value Playwright journeys against an ephemeral full stack.
# Kept off the per-PR critical path (slow); runs nightly, on-demand, and when a
# PR is labelled `e2e`.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'e2e')
    name: Playwright journeys
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: '3000'
      MONGODB_URI: mongodb://localhost:27017/apos_e2e?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: e2e-access-secret-value-0123456789
      JWT_REFRESH_SECRET: e2e-refresh-secret-value-0123456789
      WEB_APP_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      VITE_API_TARGET: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Start MongoDB (replica set)
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Install Playwright browsers
        run: pnpm --filter @ai-projectos/web exec playwright install --with-deps chromium

      - name: Run E2E journeys
        run: pnpm --filter @ai-projectos/web exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
