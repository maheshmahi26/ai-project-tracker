name: ai-projectos

# Local development infrastructure for AI ProjectOS.
# Bring up with:  make up   (from repo root)  or  docker compose -f docker/docker-compose.yml up -d
# Optional dev UIs:  docker compose -f docker/docker-compose.yml --profile tools up -d

services:
  # MongoDB as a single-node replica set so multi-document transactions work locally
  # exactly as they do in production. The healthcheck self-initiates the replica set.
  mongo:
    image: mongo:7
    container_name: aiprojectos-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: aiprojectos-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant — vector database for RAG (HTTP :6333, gRPC :6334, dashboard at /dashboard)
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: aiprojectos-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant-data:/qdrant/storage

  # MinIO — S3-compatible object storage for local file uploads (R2 in prod)
  minio:
    image: minio/minio:latest
    container_name: aiprojectos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5

  # One-shot: create the default bucket in MinIO once it is ready.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ai-projectos &&
      echo 'MinIO bucket ready';
      "
    restart: 'no'

  # ---- Optional developer UIs (enable with: --profile tools) ----
  mongo-express:
    image: mongo-express:1.0.2
    container_name: aiprojectos-mongo-express
    profiles: ['tools']
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH: 'false'
    ports:
      - '8081:8081'

  redis-insight:
    image: redis/redisinsight:latest
    container_name: aiprojectos-redis-insight
    profiles: ['tools']
    restart: unless-stopped
    ports:
      - '5540:5540'

volumes:
  mongo-data:
  redis-data:
  qdrant-data:
  minio-data:
