name: ai-projectos-prod

# Production-like, self-hosted stack: data tier (Mongo RS + Redis + Qdrant) plus
# the API and worker built from apps/api/Dockerfile. The web SPA ships to Vercel
# (or use apps/web/Dockerfile for self-hosting).
#
# Usage (from repo root):
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker/docker-compose.prod.yml run --rm migrate   # one-shot index/bootstrap
#
# Secrets come from .env.prod (never committed). See .env.example for keys.

x-app-env: &app-env
  NODE_ENV: production
  MONGODB_URI: ${MONGODB_URI}
  REDIS_URL: ${REDIS_URL}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  WEB_APP_URL: ${WEB_APP_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-ai-projectos}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  BETTER_STACK_SOURCE_TOKEN: ${BETTER_STACK_SOURCE_TOKEN:-}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-data:/qdrant/storage

  # One-shot idempotent migration/bootstrap (indexes + Qdrant collection).
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ai-projectos-api:latest
    command: ['node', 'dist/scripts/migrate.js']
    environment: *app-env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ai-projectos-api:latest
    restart: unless-stopped
    environment: *app-env
    ports:
      - '3000:3000'
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    image: ai-projectos-api:latest
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    environment: *app-env
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }

volumes:
  mongo-data:
  redis-data:
  qdrant-data:
